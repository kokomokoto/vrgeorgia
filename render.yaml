# VR Georgia — Render.com Deployment
# https://render.com/docs/yaml-spec
#
# Production (ქვემოთ): vrgeorgia-api + vrgeorgia-web
# Staging (ხელით Render Dashboard-ზე, Free):
#   - vrgeorgia-api-staging  (rootDir: backend, Free, sleep OK)
#   - vrgeorgia-web-staging  (rootDir: frontend, Free)
#   - დომენი: staging.vrgeorgia.ge → web-staging
#   - ცალკე MONGODB_URI (არა production DB!)
#   - ALLOWED_ORIGINS=https://staging.vrgeorgia.ge
#   - NEXT_PUBLIC_API_BASE → api-staging URL
#
# 3D ტურის რედაქტორი/ნახვა: https://vrgeorgia-api.onrender.com/v/{id}
#
# მეხსიერება: Starter (512MB) შეიძლება არ ეყოთ API+Next.js ერთად.
# თუ Render აგზავნის "exceeded memory limit" → Instance Type: Standard (2GB).

services:
  # ──── Backend API + 3D Tour Builder UI ────
  - type: web
    name: vrgeorgia-api
    runtime: node
    region: frankfurt
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=460
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MONGODB_URI
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://vrgeorgia.ge,https://www.vrgeorgia.ge,https://vhome.ge,https://www.vhome.ge,https://vrgeorgia-frontend.onrender.com,https://vrgeorgia-api.onrender.com
      - key: TOUR_BUILDER_PUBLIC_URL
        value: https://vrgeorgia-api.onrender.com
      - key: API_PUBLIC_URL
        value: https://vrgeorgia-api.onrender.com
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
    disk:
      name: vrgeorgia-uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1

  # ──── Frontend ────
  - type: web
    name: vrgeorgia-web
    runtime: node
    region: frankfurt
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: node .next/standalone/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_BASE
        value: https://vrgeorgia-api.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://vrgeorgia-api.onrender.com/api
      - key: NEXT_PUBLIC_TOUR_BUILDER_URL
        value: https://vrgeorgia-api.onrender.com
